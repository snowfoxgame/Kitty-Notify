[package]
name = "kittynotify"
version = "0.1.0"
edition = "2021"
authors = ["KittyNotify Contributors"]
description = "A quirky, pixel-art desktop update notifier for Arch Linux (KDE Plasma Wayland)"
license = "GPL-3.0-or-later"

[features]
default = ["smart", "wayland"]
lightweight = []
smart = ["dep:sysinfo"]
wayland = ["dep:gtk4-layer-shell"]

[dependencies]
# GTK & Desktop Toolkits
gtk4 = "0.11"
libadwaita = "0.9"
gtk4-layer-shell = { version = "0.8", optional = true }
cairo-rs = { version = "0.22", features = ["use_glib"] }
gdk-pixbuf = "0.22"
glib = "0.22"
gio = "0.22"
pango = "0.22"

# CLI & Configuration
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
dirs = "6.0"
glob = "0.3"

# Async & Runtime
tokio = { version = "1.43", features = ["rt-multi-thread", "process", "time", "macros", "sync"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sysinfo = { version = "0.39.6", optional = true }
rand = "0.10.3"
async-channel = "2.5.0"
